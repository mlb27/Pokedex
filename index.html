<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pokedex</title>
        <link rel="stylesheet" href="./style.css" />
        <link rel="stylesheet" href="./assets/styles/standard.css" />
        <link rel="stylesheet" href="./assets/styles/assets.css" />
        <link rel="stylesheet" href="./assets/styles/backgrounds.css" />
        <link rel="stylesheet" href="./assets/styles/button.css" />
        <link rel="stylesheet" href="./assets/styles/input.css" />
        <script src="./script.js"></script>
        <script src="./assets/scripts/template.js"></script>
        <script src="./assets/scripts/backgrounds.js"></script>
        <script src="./assets/scripts/search.js"></script>
    </head>
    <body onload="init()" class="p-b16 bg-grey">
        <nav class="flex jc-sb alig-i-c bg-s-grey">
            <div class="white flex flex1">
                <div class="flex flex-d-column">
                    <span class="flex flex-d-row flex-wrap gap4-8">
                        <button onclick="filter('fire')" class="filter-btn bg-fire white">Fire</button>
                        <button onclick="filter('grass')" class="filter-btn bg-grass white">Grass</button>
                        <button onclick="filter('water')" class="filter-btn bg-water white">Water</button>
                        <button onclick="filter('bug')" class="filter-btn bg-bug white">Bug</button>
                        <button onclick="filter('normal')" class="filter-btn bg-normal white">Normal</button>
                        <button onclick="filter('ground')" class="filter-btn bg-ground white">Ground</button>
                        <button onclick="filter('poison')" class="filter-btn bg-poison white">Poison</button>
                        <button onclick="filter('fairy')" class="filter-btn bg-fairy">Fairy</button>
                        <button onclick="filter('electric')" class="filter-btn bg-electric">Electric</button>
                        <button onclick="filter('fighting')" class="filter-btn bg-fighting white">Fighting</button>
                        <button onclick="filter('psychic')" class="filter-btn bg-psychic white">Psychic</button>
                        <button onclick="filter('flying')" class="filter-btn bg-flying white">Flying</button>
                        <button onclick="filter('ice')" class="filter-btn bg-ice white">Ice</button>
                        <button onclick="filter('dragon')" class="filter-btn bg-dragon">Dragon</button>
                        <button onclick="filter('dark')" class="filter-btn bg-dark white">Dark</button>
                        <button onclick="filter('rock')" class="filter-btn bg-rock white">Rock</button>
                        <button onclick="filter('ghost')" class="filter-btn bg-ghost">Ghost</button>
                    </span>
                </div>
            </div>
            <img class="flex" src="./assets/img/pokeball.png" alt="Pokeball" onclick="window.scrollTo({ top: 0 })" />
            <div class="flex flex1 jc-e">
                <div class="input-group">
                    <label for="search" class="label">Search</label>
                    <input autocomplete="off" name="Search" id="search" class="input white" type="search" oninput="searchForPokemon()" />
                </div>
            </div>
        </nav>
        <main class="flex flex-wrap jc-c alig-i-c" id="main"></main>
        <div class="flex jc-c alig-i-c p-b16"><button class="button-38" onclick="loadData()" role="button">Load more</button></div>
        <footer class="flex jc-c alig-i-c flex-d-column">
            <img src="./assets/img/pokedex.png" alt="Pokedex" class="p-b16" />
            <p>Made by <a href="https://github.com/mlb27" class="yellow-p">kyr0nix</a></p>
        </footer>
    </body>
</html>
